<!DOCTYPE html>
<html>
<head>
  <title>relationship_status.log</title>
  <style>
    body {
      background-color: #0b0b0b;
      color: #7CFF7C;
      font-family: monospace;
      padding: 40px;
      line-height: 1.6;
    }
    .cursor {
      animation: blink 1s infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

<div id="terminal"></div>
<p>> _<span class="cursor">█</span></p>

<script>
  const lines = [
    "> booting relationship.exe",
    "> loading memories...",
    "> loading inside jokes...",
    "> loading emotional support module...",
    "> emotional support module: FOUND (you)",
    "",
    "> running stability_check()",
    "> result: somehow still works even when i’m dramatic",
    "",
    "> dependency_report:",
    "• patience: you",
    "• loyalty: you",
    "• calm_when_i_overthink: also you",
    "",
    "> note_from_developer:",
    "thank you for staying.",
    "for listening. for choosing me.",
    "for being on my side even when i’m not very easy to debug.",
    "",
    "> system_status:",
    "life is louder, warmer, and better with you in it.",
    "",
    "> next_update:",
    "more laughs. more memories. more us.",
    "",
    "> end_process()"
  ];

  const terminal = document.getElementById("terminal");
  let index = 0;

  function printLine() {
    if (index < lines.length) {
      const line = document.createElement("p");
      line.textContent = lines[index];
      terminal.appendChild(line);
      index++;
      setTimeout(printLine, 500); // speed (ms)
    }
  }

  printLine();
</script>

</body>
</html>
