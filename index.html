<!DOCTYPE html>
<html>
<head>
  <title>relationship_status.log</title>
  <style>
    body {
      background-color: #0b0b0b;
      color: #7CFF7C;
      font-family: monospace;
      padding: 40px;
      line-height: 1.6;
    }

    .cursor {
      display: inline-block;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

<div id="terminal"></div>

<script>
  const lines = [
    "> booting relationship.exe",
    "> loading memories...",
    "> loading inside jokes...",
    "> loading emotional support module...",
    "> emotional support module: FOUND (you)",
    "",
    "> running stability_check()",
    "> result: somehow still works even when i’m dramatic",
    "",
    "> dependency_report:",
    "• patience: you",
    "• loyalty: you",
    "• calm_when_i_overthink: also you",
    "",
    "> note_from_developer:",
    "thank you for staying.",
    "for listening. for choosing me.",
    "for being on my side even when i’m not very easy to debug.",
    "",
    "> system_status:",
    "life is louder, warmer, and better with you in it.",
    "",
    "> next_update:",
    "more laughs. more memories. more us.",
    "",
    "> end_process()"
  ];

  const terminal = document.getElementById("terminal");
  let line = 0;
  let char = 0;

  function type() {
    if (line >= lines.length) return;

    if (char === 0) {
      const p = document.createElement("p");
      p.id = "line-" + line;
      terminal.appendChild(p);
    }

    const current = document.getElementById("line-" + line);

    if (char < lines[line].length) {
      current.textContent += lines[line].charAt(char);
      char++;
      setTimeout(type, 35); // LETTER speed
    } else {
      char = 0;
      line++;
      setTimeout(type, 400); // pause between lines
    }
  }

  type();
</script>

<p>> <span class="cursor">█</span></p>

</body>
</html>
